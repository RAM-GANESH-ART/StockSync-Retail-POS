name: StockSync CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Build, Types, Tests & Quality Gate
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci_pipeline_secret_test_key_2026"
      NEXTAUTH_URL: "http://localhost:3000"
      RAZORPAY_KEY_ID: "rzp_test_simulator"
      RAZORPAY_KEY_SECRET: "rzp_test_secret"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (Rust Query Engine)
        run: npx prisma generate

      - name: Type Check (TypeScript strict)
        run: npx tsc --noEmit

      - name: Run Automated Unit Tests (Vitest)
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
