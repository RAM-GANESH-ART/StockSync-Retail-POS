services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksync-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocksync_pos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksync_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
